[project]
name = "orbital-app"
version = "0.1.0"
description = "Orbital Python Shell - Python host of a program served by the native kernel"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
