name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    # GitHub-hosted on purpose: a public repo runs fork PRs, which must never reach a self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Almadar language data
        run: npm install --no-save --no-package-lock @almadar/core@^10 @almadar/std@^16 @almadar/lolo-ar@^1 @almadar/lolo-sl@^1

      - uses: dtolnay/rust-toolchain@1.93.0

      - name: Check standalone package manifests
        run: |
          cargo metadata --no-deps --format-version 1 --manifest-path bridges/native/Cargo.toml > /dev/null

      - name: Test
        run: cargo test
